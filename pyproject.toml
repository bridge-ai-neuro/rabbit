[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbit"
version = "0.1.0"
description = "RABBiT — speech-to-fMRI brain encoder with ROI query attention and shared+deviation readouts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Omer Moussa" },
]
keywords = ["fmri", "brain-encoding", "speech", "wav2vec2", "wavlm", "neuroscience"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40,<5",
    "peft>=0.10",
    "accelerate>=0.30",
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "soundfile>=0.12",
    "librosa>=0.10",
    "matplotlib>=3.7",
    "pyyaml>=6",
    "tqdm>=4.65",
]

[project.optional-dependencies]
fs6 = [
    "mne>=1.6",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
rabbit-predict = "rabbit.cli:predict_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/rabbit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
